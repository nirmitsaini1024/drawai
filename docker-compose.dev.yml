# Dev overrides with hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Requires Docker Compose >= 2.24 (uses !override). Vite on :5173, API on :8000, sync on :8787.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432" # for psql / GUI tools

  api:
    command:
      - uvicorn
      - main:app
      - --reload
      - --reload-dir
      - /app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      TRUST_PROXY: "0"
    volumes:
      - ./server:/app
    ports:
      - "127.0.0.1:8000:8000"

  sync:
    command: ["node", "--watch", "sync-server/server.mjs"]
    volumes:
      - ./sync-server:/app/sync-server
    ports:
      - "127.0.0.1:8787:8787"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    environment:
      # In dev the browser talks to the API and sync server directly (CORS allows :5173).
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SYNC_WS_URL: ws://localhost:8787/connect
    volumes:
      - .:/app
      - /app/node_modules # keep the image's node_modules, don't shadow with the host's
    ports: !override
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
